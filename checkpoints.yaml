# Restructured canonical stream (early-overload), cp1-250, Act VI removed. STAGE 1: cp1-60.
# Compressed spine cp2-6, hub `keel` at cp9 (read by ~39), rules early (trim cp4, round cp8, hold
# cp12, SINK cp16, missing cp20). Reference model: harness/oracle/overload.py. Cadence 3:1.
checkpoints:
