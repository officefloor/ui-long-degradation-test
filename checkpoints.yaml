    #   row data-testids (owner-row-<id>, owner-name-<id>, owner-email-<id>) read the seeded values.
    #   core: fill owner-form-name + owner-form-email, click owner-form-submit; a 3rd row appears.
    # test: acceptance/specs/cp01_add_owner.spec.ts
    # type: additive          # tag: @core

