# The ordered, cumulative checkpoint stream. Each checkpoint is applied on top of the
# committed result of the previous one, GROWING ONE APP FROM A NEAR-EMPTY BASE (no
# tables at cp01). STUB — author the real ~60 here. DESIGN — see DESIGN.md.
#
# DOMAIN: a generic business app — OWNERS, PROJECTS, INVOICES (what OfficeHQ users build and
# recognise). Not a Spring comparison, so there is no reference implementation. The app grows from
# nothing: early checkpoints create owners, then projects, then invoices, then cross-feature screens
# (a project's invoices), filters, edits, and audit rules (DESIGN.md §12).
#
# FULL-STACK ENGLISH REQUESTS. Each checkpoint has two parts:
#   - `request`: a plain-English change request, as an OfficeHQ user would write it
#     ("let me add an owner with a name and email, and list all owners"). Given to the agent.
#     Each is satisfiable as a full-stack change — schema migration + OfficeFloor server +
#     front-end (+ an audit record where the rule is a side-effect) (DESIGN.md §1, §2, §5).
#   - `test`: the experimenter-authored cpNN Playwright spec — the OBJECTIVE gate, also given to
#     the agent so it knows the exact data-testid anchors + values (and audit records) to satisfy.
#
# TWO ASSERTION CHANNELS (DESIGN.md §3). Tests assert through the UI (data-testid) for user-visible
# behaviour, and through the KNOWN AUDIT FILE for side-effects (support/audit.ts). Data is arranged
# per-spec via /__test__ (reset+seed; reset also clears the audit file). Every value/anchor and every
# audit record is given EXACTLY in the spec. Once introduced, a data-testid (and an audit record
# format) is immutable public API — never rename/remove it.
#
# REUSE PRESSURE (deliberate). Load the sequence with changes that pressure shared
# surfaces — the same table/screen reused with growing needs, cross-feature data on one
# page, navigation growth, variant explosion, and schema changes that touch prior data.
# If the sequence never pressures shared surfaces, nothing erodes and the experiment
# proves nothing (DESIGN.md §12).
#
# CONTEXT-FREE (BLIND) AGENT. Each checkpoint runs a fresh agent with NO memory of prior
# checkpoints and WITHOUT the prior specs; it works only from the current code, its
# request, and its own spec. A request/spec must be self-contained: never reference a
# checkpoint number; a mutative one describes the EXISTING behaviour to change in terms
# the agent can find in the running app.
#
# ADDITIVE vs MUTATIVE (experimenter metadata; not shown to the agent). Most checkpoints
# are additive and install only their own cpNN spec. A MUTATIVE checkpoint declares
# `type: mutative`, the prior checkpoint numbers it changes in `mutates`, and ships
# updated copies of each changed prior spec. A regression on a rule listed in `mutates`
# is INTENDED; breakage on any rule NOT listed is a true regression (incl. seed-path
# breakage when a schema/API change breaks a prior spec's seed — DESIGN.md §6).

checkpoints:
  - id: cp01_owners
    type: additive        # categories: @core
    test: acceptance/specs/cp01_owners.spec.ts
    request: |
      I want to keep track of owners. Add an "Owners" section I can reach from the main navigation
      that lists all owners with their name and email, and a form on that page to add a new owner
      by entering a name and an email. New owners appear in the list.

  - id: cp02_owner_email_validation
    type: additive        # categories: @error, @core
    test: acceptance/specs/cp02_owner_email_validation.spec.ts
    request: |
      Every owner must have a valid email address. If I try to add an owner with the email left
      blank, or with something that isn't a valid email, don't add it — show an error next to the
      email field and leave the list unchanged. A valid email adds the owner as normal.

  - id: cp03_projects
    type: additive        # categories: @core  (cross-entity join)
    test: acceptance/specs/cp03_projects.spec.ts
    request: |
      Add a "Projects" section in the navigation. Each project has a name and belongs to one owner.
      The projects list shows the project name and the owner's name. I can add a project by typing a
      name and choosing which owner it belongs to.

  - id: cp04_project_invoices
    type: additive        # categories: @core  (cross-feature screen + derived total)
    test: acceptance/specs/cp04_project_invoices.spec.ts
    request: |
      Let me open a project to see its details. On a project's page, show the invoices for that
      project, each with its amount, and a total of all the project's invoice amounts. I can add an
      invoice to the project by entering an amount.

  - id: cp05_invoice_pay_audit
    type: additive        # categories: @functionality  (status transition + audit-file side-effect)
    test: acceptance/specs/cp05_invoice_pay_audit.spec.ts
    request: |
      An invoice is either unpaid or paid, and shows its status. On a project's page I can mark an
      invoice as paid, which updates its status to paid. Whenever an invoice is marked paid, record
      it in the audit log as: INVOICE_PAID id=<id> amount=<amount> (amount with two decimals).

  # ── Later checkpoints escalate reuse-pressure and introduce the first MUTATIVE change, e.g. ──
  # - id: cpNN_soft_delete_owner
  #   type: mutative
  #   mutates: [1]        # changing how owners are removed alters cp01's behaviour (intended)
  #   tests:
  #     - acceptance/specs/cpNN_soft_delete_owner.spec.ts
  #     - acceptance/specs/cpNN/cp01_owners.spec.ts   # updated copy of the changed prior spec
