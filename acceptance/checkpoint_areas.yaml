# Area classification for the frozen Act I checkpoints (cp01-60). These entries predate the
# `area:` field and are kept byte-stable for comparability with runs already recorded, so their
# area lives here instead of inline. harness.checkpoint_lint reads an inline `area:` first and
# falls back to this map. New checkpoints (cp61+) carry `area:` inline in checkpoints.yaml.
#
# `billing` is the core/on-spine area: the invoice money pipeline (line items -> subtotal ->
# discount -> tax -> rounding -> total -> payments/allocation -> amount due -> status) AND every
# screen that RE-READS those figures (statement, project budget vs invoiced, dashboard owed/
# overdue/top-clients). A change tagged `billing` exerts erosion pressure on that one spine.
# Everything else is off-spine (the low-pressure control region): clients, projects, jobs, tasks.
#
# Act I is ~53% billing (32/60); the long-horizon extension raises the whole-stream share by
# concentrating cp61+ on the spine (see docs/LONG_HORIZON_DESIGN.md).
areas:
  1: clients        # cp01_clients
  2: clients        # cp02_client_email_validation
  3: projects       # cp03_projects
  4: billing        # cp04_project_invoices
  5: billing        # cp05_invoice_pay_audit
  6: clients        # cp06_client_search
  7: projects       # cp07_client_detail_projects
  8: billing        # cp08_dashboard (surfaces outstanding totals)
