# ui-long-degradation-test configuration. STUB — fill in as the harness is built.
# Mirrors the REST arm's config.yaml shape (DESIGN.md §13) with UI-specific sections.
# ${VARS} and ~ are expanded from the environment; relative paths anchor inside this repo.

model: claude-opus-4-8          # the fixed coding agent. Override per run with --model
chains: 10                      # independent runs per (arm, strategy) for tight CIs
active_strategy: just-solve
agent_timeout: 3600

checkpoints_file: checkpoints.yaml

limits:
  # rate/cost limits for the agent turn (lift from the REST arm)

# The System-Under-Test launcher: ONE whole-stack start script brings up everything on a
# single port — a freshly SEEDED deterministic database, the constant OfficeFloor server,
# and the arm's built front-end served by it (DESIGN.md §2, §14). This is the CONSTANT
# layer: the launcher and the OfficeFloor image are byte-identical across every arm and
# checkpoint; only the front-end dist it is pointed at varies.
sut:
  repo: ${HOME}/compare/officehq-sut   # holds the whole-stack start/stop scripts + OfficeFloor
  start_cmd: bin/start                  # env: PORT, FRONTEND_DIST -> seed DB, start OfficeFloor
                                        #      serving that dist + the API on PORT. Deterministic
                                        #      seed on every start = the per-checkpoint reset.
  stop_cmd: bin/stop                    # idempotent teardown of the whole stack (frees PORT)
  port: 3000
  health_url: http://localhost:3000/health   # readiness probe used by correctness.wait_ready

# The candidate front-ends under test (DESIGN.md §10, §14). Each is an EXTERNAL code
# folder, only ever READ as a start point; the harness mirrors it into work_root/sandbox
# (copy/sync + Landlock) for the agent turn, and BUILDS it to a servable dist that the
# whole-stack launcher serves. All arms start from ONE shared opinionated shell so the
# file-scope-container comparison is fair (DESIGN.md §8).
arms:
  control:            # component SPA + global store + client router (expected slop magnet)
    repo: ${HOME}/compare/ui-control
    base_ref: base-no-specs        # app + shared shell only; no pre-existing checkpoint specs
    source_globs: ["src/**/*.{ts,tsx}"]      # Lizard full-fidelity formats (DESIGN.md §8)
    shared_surfaces:               # boundary-violation targets (DESIGN.md §8, metrics.boundary_violations)
      router: ["src/router/**", "src/App.tsx"]
      store:  ["src/store/**"]
      primitives: ["src/components/ui/**"]
    build_cmd: bin/build           # produces a static bundle the launcher serves
    dist_dir: dist                 # relative to the worktree; passed as FRONTEND_DIST

  additive:           # file routing · no global store · closed primitives · slice boundaries · scoped styles
    repo: ${HOME}/compare/ui-additive
    base_ref: base-no-specs
    source_globs: ["src/**/*.{ts,tsx}"]
    shared_surfaces:
      router: []                   # file-based routing: adding a route is a new file, not an edit
      primitives: ["src/ui/**"]
    build_cmd: bin/build
    dist_dir: dist

  server_driven:      # OfficeFloor templates + HTMX fragments (measured mostly by boundary violations)
    repo: ${HOME}/compare/ui-htmx
    base_ref: base-no-specs
    source_globs: ["src/**/*.{ts,html}"]     # NOTE: HTMX logic in hx-* attrs is invisible to Lizard (DESIGN.md §8)
    shared_surfaces:
      layout: ["templates/_layout.html"]
    build_cmd: bin/build           # may be a near no-op; NOTE: server-rendered templates blur the
    dist_dir: dist                 # constant-backend line (DESIGN.md §8.1, §10) — decide how the
                                   # launcher serves these vs the constant OfficeFloor image.

  # full:             # optional CEILING control: agent sees prior specs -> regressions ~0

prompt_strategies:
  just-solve:
    # template: |
    #   <the constant prompt; the data-test-id immutability rule lives in the shared AGENTS.md>

# Correctness oracle: build the front-end, bring the whole stack up on sut.port via the
# single launcher, drive with Playwright bound to data-test-id ONLY (DESIGN.md §3,§5,§9,§14).
acceptance:
  specs_dir: acceptance/specs
  dest_subpath: e2e                # where specs are copied into the mirrored sandbox / worktree
  base_url: http://localhost:3000  # = sut.port; Playwright hits ONLY this (never API/DB)
  # strict awaiting on data-test-id presence; select cp01..cpK at checkpoint K

impact_gate:
  # block/warn percentiles; NOTE: needs a TS seed distribution before grades mean
  # anything (DESIGN.md §8, harness/impact_gate.py)

tools:
  # pinned versions: node, playwright, lizard, impact-gate, jscpd/ast-grep(-ts)

# Filesystem confinement for the agent turn (Linux Landlock; no root/bwrap). Identical
# to the REST arm; fails CLOSED. Verify:  python harness/landlock_selftest.py
isolation:
  pin_files: ["AGENTS.md", "CLAUDE.md"]   # the data-test-id contract rule is pinned, never AI-edited
  agent_confinement:
    enabled: true
    extra_ro_binds: []   # toolchain not under /usr,/opt,~/.local (e.g. a pinned node)
    extra_rw_binds: []   # e.g. an alternate npm/pnpm store so build works inside the sandbox

paths:
  # Both MUST be absolute, EXTERNAL, and SEPARATE (see the REST arm's paths note): the
  # agent's cwd is sandbox_root, so it must have no worktree/.git/results siblings to walk
  # into. work_root holds per-chain worktrees; sandbox_root IS the agent's cwd, rebuilt
  # fresh each turn (a dedicated dir — a home/root path is refused).
  work_root: ${HOME}/ui-work
  sandbox_root: ${HOME}/ui-sandbox
  results_csv: results/records.csv
